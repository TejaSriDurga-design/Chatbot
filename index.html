<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chat UI</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: #343541;
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Top Navbar */
.navbar {
  background: #202123;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 18px;
  font-weight: bold;
}

.nav-buttons button {
  margin-left: 10px;
  padding: 8px 15px;
  border-radius: 5px;
  border: none;
  cursor: pointer;
  font-weight: 500;
}

.login-btn {
  background: #10a37f;
  color: white;
}

.register-btn {
  background: #444654;
  color: white;
}

/* Chat Area */
.chat-container {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.message {
  margin-bottom: 15px;
  display: flex;
}

.user {
  justify-content: flex-end;
}

.bot {
  justify-content: flex-start;
}

.bubble {
  max-width: 60%;
  padding: 12px 15px;
  border-radius: 8px;
  line-height: 1.4;
}

.user .bubble {
  background: #10a37f;
}

.bot .bubble {
  background: #444654;
}

/* === NEW SMALL CENTERED INPUT AREA === */
.input-area {
  padding: 15px;
  display: flex;
  justify-content: center;
  background: transparent;
}

.input-wrapper {
  width: 500px;
  max-width: 90%;
  display: flex;
  background: #40414f;
  padding: 8px;
  border-radius: 30px;
}

.input-wrapper input {
  flex: 1;
  padding: 10px 15px;
  border-radius: 20px;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font-size: 14px;
}

.input-wrapper button {
  padding: 8px 16px;
  border: none;
  border-radius: 20px;
  background: #10a37f;
  color: white;
  cursor: pointer;
  font-size: 14px;
}

/* Modal (Login/Register Popup) */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
}

.modal-box {
  background: #202123;
  padding: 25px;
  border-radius: 10px;
  width: 300px;
  text-align: center;
}

.modal-box h2 {
  margin-bottom: 15px;
}

.modal-box input {
  width: 80%;
  padding: 10px;
  margin-bottom: 15px;
  border-radius: 5px;
  border: none;
}

.modal-box button {
  width: 80%;
  padding: 10px;
  background: #10a37f;
  border: none;
  border-radius: 5px;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
  <div class="logo">My ChatBot</div>
  <div class="nav-buttons">
    <button class="login-btn" onclick="openLogin()">Login</button>
    <button class="register-btn" onclick="openRegister()">Register</button>
  </div>
</div>

<!-- Chat Area -->
<div class="chat-container" id="chatBox"></div>

<!-- Input -->
<div class="input-area">
  <div class="input-wrapper">
    <input type="text" id="messageInput" placeholder="Send a message..." onkeypress="handleKey(event)">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<!-- Login Modal -->
<div class="modal" id="loginModal">
  <div class="modal-box">
    <h2>Login</h2>
    <input type="text" id="loginUser" placeholder="Username">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- Register Modal -->
<div class="modal" id="registerModal">
  <div class="modal-box">
    <h2>Register</h2>
    <input type="text" id="regUser" placeholder="Username">
    <input type="password" id="regPass" placeholder="Password">
    <button onclick="register()">Register</button>
  </div>
</div>

<script>
function openLogin() {
  document.getElementById("loginModal").style.display = "flex";
}

function openRegister() {
  document.getElementById("registerModal").style.display = "flex";
}

window.onclick = function(e) {
  if (e.target.classList.contains("modal")) {
    e.target.style.display = "none";
  }
}

function register() {
  const user = document.getElementById("regUser").value;
  const pass = document.getElementById("regPass").value;
  if (!user || !pass) return alert("Fill all fields");
  localStorage.setItem(user, pass);
  alert("Registered successfully!");
  document.getElementById("registerModal").style.display = "none";
}

function login() {
  const user = document.getElementById("loginUser").value;
  const pass = document.getElementById("loginPass").value;
  if (localStorage.getItem(user) === pass) {
    alert("Login successful!");
    document.getElementById("loginModal").style.display = "none";
  } else {
    alert("Invalid credentials");
  }
}

function handleKey(e) {
  if (e.key === "Enter") sendMessage();
}

function sendMessage() {
  const inputField = document.getElementById("messageInput");
  const input = inputField.value.trim();
  if (!input) return;

  const chatBox = document.getElementById("chatBox");

  chatBox.innerHTML += `
    <div class="message user">
      <div class="bubble">${input}</div>
    </div>
    <div class="message bot">
      <div class="bubble">Demo reply: ${input}</div>
    </div>
  `;

  inputField.value = "";
  chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
